nodes:
  # Contract-only python-csv node: no script, no in-repo read. The runtime
  # loads the file at `reads.csv` directly from object storage and writes it
  # through unmodified — the worked example of the csv kind alongside the
  # script-backed node in py_daily_kpis.yml.
  - schema: analytics
    table: demo_orders_csv
    description: "Contract-only csv node: loads the demo orders export from object storage"
    owner: "service-py"
    schedule: daily
    criticality: SECONDARY
    kind: python-csv
    reads:
      csv: s3://continuo/static-files/demo/orders.csv
    output_columns:
      - {name: order_id, type: INTEGER, nullable: false}
      - {name: customer, type: "VARCHAR(64)", nullable: true}
      - {name: amount, type: "DOUBLE PRECISION", nullable: true}
