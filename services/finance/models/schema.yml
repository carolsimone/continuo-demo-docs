version: 2

models:
  - name: fx_transactions_eur
    description: "FX transactions with amount restated in EUR via seed_fx_rates_eur."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: rate_to_eur
        description: "Multiplier applied to amount; NULL means an uncovered (currency, date) pair."
        tests:
          - not_null
      - name: fee_amount
        description: "Fee the company earned, denominated in currency_from."
        tests:
          - not_null
      - name: fee_amount_eur
        description: "fee_amount converted to EUR on the same rate_to_eur join as amount_eur."
        tests:
          - not_null

  - name: operational_costs_monthly
    description: "Operational costs rolled up to one row per month, with COGS/R&D/G&A breakdown columns. Source of the monthly totals that operational_cost_per_user divides across users acquired that month. All amounts are EUR."
    columns:
      - name: cost_month
        description: "First day of the calendar month the costs fall in."
        tests:
          - unique
          - not_null
      - name: total_cost_eur
        description: "Total operational cost for the month, in EUR, rounded to cents. Equals cogs_eur + rd_eur + ga_eur, and also equals variable_cost_eur + fixed_cost_eur."
        tests:
          - not_null
      - name: variable_cost_eur
        description: "The variable share (cloud hosting, transaction fees) of the month's operational cost, in EUR. The basis for the per-user variable_cost_eur that ltv_per_user subtracts from revenue to get contribution margin."
        tests:
          - not_null
      - name: fixed_cost_eur
        description: "The fixed share (e.g. salaries, customer support) of the month's operational cost, in EUR. Excluded from contribution margin in ltv_per_user; belongs in a fully-allocated view instead."
        tests:
          - not_null
      - name: cost_line_count
        description: "Number of cost-line seed rows rolled into this month."
        tests:
          - not_null

  - name: operational_cost_per_user
    description: "Per-user operational cost: each month's total operational cost divided evenly across the users acquired that month (from core's seed_users, read cross-service). One row per user. A cost month with zero signups would be unallocated and absent here; today every one of the 24 cost months has a matching cohort, so any gap between this table's total and operational_costs_monthly's total is per-user cent rounding, not unallocated months. Per-user costs within a cohort can sum a few cents off the month's total due to rounding. Counterpart of marketing's marketing_cost_per_user; both feed ltv_per_user."
    columns:
      - name: user_id
        description: "Matches core.seed_users.user_id, marketing's marketing_cost_per_user.user_id, and finance's transaction user ids."
        tests:
          - unique
          - not_null
      - name: acquired_at
        description: "Exact timestamp the user was acquired (seed_users.created_at), before truncation to acquisition_month."
        tests:
          - not_null
      - name: acquisition_month
        description: "First day of the month the user was acquired; the month whose total cost is divided."
        tests:
          - not_null
      - name: users_in_cohort
        description: "How many users were acquired in that month -- the divisor. Carried so the division can be reconstructed without re-deriving the cohort."
        tests:
          - not_null
      - name: operational_cost_eur
        description: "The user's even share of their acquisition month's total operational cost, in EUR. Always positive; never NULL."
        tests:
          - not_null
      - name: variable_cost_eur
        description: "The variable share (cloud hosting, transaction fees) of this user's allocated operational cost. Subtracted from revenue to get contribution margin in ltv_per_user."
        tests:
          - not_null

  - name: ltv_per_user
    description: "Per-user unit economics. contribution_margin_eur (revenue minus variable cost) is the standard LTV numerator and drives ltv_to_cac; fully_allocated_eur additionally subtracts fixed operational cost and is negative for essentially every user, which is the honest picture for a company at this stage. One row per user. Reads core and marketing cross-service by raw schema-qualified name."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: acquisition_month
        tests:
          - not_null
      - name: revenue_eur
        tests:
          - not_null
      - name: contribution_margin_eur
        description: "revenue_eur - variable_cost_eur. The LTV numerator."
        tests:
          - not_null
      - name: fully_allocated_eur
        description: "revenue_eur - operational_cost_eur - marketing_cost_eur. Expected negative."
        tests:
          - not_null
      - name: ltv_to_cac
        description: "contribution_margin_eur / marketing_cost_eur. NULL for organic users, who have zero CAC."

seeds:
  - name: seed_fx_rates_eur
    description: "Per-(currency, date) rate to convert a currency amount into EUR."
    columns:
      - name: currency
        tests:
          - not_null
      - name: rate_date
        tests:
          - not_null
      - name: rate_to_eur
        tests:
          - not_null

  - name: seed_operational_costs
    description: "Monthly operational cost lines (category x subcategory), 2023-01 to 2024-12. Generated by scripts/gen_operational_costs.py — edit that script, not this CSV."
    columns:
      - name: cost_id
        tests:
          - unique
          - not_null
      - name: amount
        tests:
          - not_null
      - name: currency
        description: "Always EUR. The accepted_values test pins the no-conversion assumption in operational_costs_monthly."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - EUR
