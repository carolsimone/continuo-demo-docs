name: ci

# continuo models a release as a SINGLE changed service (see continuo-demo's
# release.yml, which this repo's services mirror), so a PR touching more than one
# services/<svc>/ can never be released as-is. Catch that at PR time.
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/release.sh'
      - 'scripts/tests/test_release_sh.py'
      - '.github/workflows/ci.yml'

jobs:
  check-single-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      service: ${{ steps.check.outputs.service }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff the PR's base against its head.
          fetch-depth: 0

      - name: Ensure at most one service changed
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED="$(git diff --name-only "$BASE" "$HEAD" -- 'services/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed service per release; this PR touches ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          echo "OK: ${COUNT} service(s) changed"

          if [ "$COUNT" -eq 1 ]; then
            SERVICE="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
            # A service is python iff it declares contracts/ (a python-node
            # service directory); every other service is a dbt project. A
            # python service writes one ODCS contract per node, as
            # contracts/<table>.odcs.yaml, and is released with the kind
            # python-odcs. A contracts/ directory without such a file is the
            # old contract.yaml layout, which this repository no longer uses.
            if compgen -G "services/${SERVICE}/contracts/*.odcs.yaml" > /dev/null; then
              KIND="python-odcs"
            elif [ -d "services/${SERVICE}/contracts" ]; then
              echo "::error::services/${SERVICE}/contracts holds no .odcs.yaml file: write one ODCS contract per node, as contracts/<table>.odcs.yaml"
              exit 1
            else
              KIND="dbt"
            fi
            echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          fi

  # Python services skip dbt entirely, so nothing above exercises their
  # contracts or scripts. Run the steps a release of the service runs before
  # it uploads odcs-bundle.json: lint, validate, build the image and pack the
  # contracts against it. A broken contract, script or image fails the PR
  # instead of a release.
  python-checks:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'python-odcs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SERVICE: ${{ needs.check-single-service.outputs.service }}
      # The runtime that checks and packs the contracts must be the one the
      # service image runs: the harness checks the image against the released
      # content hash when a node starts. Move this pin only together with the
      # FROM line of the service's Dockerfile; the first step below fails
      # when the two differ.
      RUNTIME_VERSION: "0.13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the image base is the pinned runtime
        run: |
          if ! grep -Eq "^FROM ghcr\.io/carolsimone/continuo-python-runtime-[a-z]+:v${RUNTIME_VERSION//./\\.}\$" "services/${SERVICE}/Dockerfile"; then
            echo "::error::services/${SERVICE}/Dockerfile must build FROM ghcr.io/carolsimone/continuo-python-runtime-<engine>:v${RUNTIME_VERSION}, the runtime CI checks the contracts with"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install continuo-python-runtime
        run: |
          uv tool install "continuo-python-runtime==${RUNTIME_VERSION}" || \
            uv tool install "git+https://github.com/carolsimone/continuo-python-runtime@v${RUNTIME_VERSION}"

      - name: Lint python scripts (no hand-written SQL)
        run: continuo-runtime lint "services/${SERVICE}/scripts"

      - name: Validate python contracts
        run: continuo-runtime validate "services/${SERVICE}/contracts" --dialect postgres

      - name: Build the service image
        run: docker build -t "${SERVICE}:ci" "services/${SERVICE}"

      # The same pack a release runs. It checks the contracts again, lints the
      # scripts and reads the image's package list with docker run. The bundle
      # stays on the runner: a PR releases nothing.
      - name: Pack the contracts
        run: |
          continuo-runtime pack "services/${SERVICE}/contracts" \
            --service "${SERVICE}" \
            --repo-root "services/${SERVICE}" \
            --image "${SERVICE}:ci" \
            --dialect postgres \
            --out "${RUNNER_TEMP}/odcs-bundle.json"

  # release.sh is the only path from CD into continuo, so it is linted and
  # exercised against a stub of continuo's release API on every change to it.
  release-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck release.sh
        run: shellcheck scripts/release.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Test release.sh
        run: uvx pytest==9.1.1 scripts/tests/test_release_sh.py -v
