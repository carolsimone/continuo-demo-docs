name: ci

# continuo models a release as a SINGLE changed service (see continuo-demo's
# release.yml, which this repo's services mirror), so a PR touching more than one
# services/<svc>/ can never be released as-is. Catch that at PR time.
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'scripts/release.sh'
      - 'scripts/tests/test_release_sh.py'
      - '.github/workflows/ci.yml'

jobs:
  check-single-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      service: ${{ steps.check.outputs.service }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff the PR's base against its head.
          fetch-depth: 0

      - name: Ensure at most one service changed
        id: check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          CHANGED="$(git diff --name-only "$BASE" "$HEAD" -- 'services/' | cut -d/ -f1-2 | sort -u)"
          COUNT="$(printf '%s\n' "$CHANGED" | grep -c . || true)"

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::continuo accepts exactly one changed service per release; this PR touches ${COUNT}:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi

          echo "OK: ${COUNT} service(s) changed"

          if [ "$COUNT" -eq 1 ]; then
            SERVICE="$(printf '%s' "$CHANGED" | cut -d/ -f2)"
            # A service is python iff it declares contracts/ (a python-node
            # service directory); every other service is a dbt project. This
            # mirrors continuo-demo's release.yml detect job so a PR is checked
            # the same way a release of it would be.
            if [ -d "services/${SERVICE}/contracts" ]; then KIND="python"; else KIND="dbt"; fi
            echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          fi

  # Python services skip dbt entirely, so nothing above exercises their
  # contracts or scripts. Run the same gate continuo-demo's release.yml runs
  # before it builds an image, so a broken contract/script fails the PR instead
  # of a release.
  python-checks:
    needs: check-single-service
    if: needs.check-single-service.outputs.kind == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Pinned deliberately, not left to float — same pin as continuo-demo's
      # release.yml install step, for the same reason: this gate must judge a PR
      # the same way a release would. Move this pin only alongside a
      # deliberate runtime upgrade.
      - name: Install continuo-python-runtime
        run: |
          uv tool install continuo-python-runtime==0.7.0 || \
            uv tool install "git+https://github.com/carolsimone/continuo-python-runtime@v0.7.0"

      - name: Lint python scripts (no hand-written SQL)
        run: continuo-runtime lint "services/${{ needs.check-single-service.outputs.service }}/scripts"

      - name: Validate python contracts
        run: continuo-runtime validate "services/${{ needs.check-single-service.outputs.service }}/contracts" --dialect postgres

  # release.sh is the only path from CD into continuo, so it is linted and
  # exercised against a stub of continuo's release API on every change to it.
  release-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck release.sh
        run: shellcheck scripts/release.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Test release.sh
        run: uvx pytest==9.1.1 scripts/tests/test_release_sh.py -v
